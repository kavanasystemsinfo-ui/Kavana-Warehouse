name: CI — KAVANA WAREHOUSE API

on:
  push:
    branches: [main, develop]
    paths-ignore:
      - 'docs/**'
      - 'dashboard/**'
      - 'mobile/**'
      - '**.md'
  pull_request:
    branches: [main]

jobs:
  test:
    runs-on: ubuntu-latest

    services:
      postgres:
        image: postgres:16
        env:
          POSTGRES_USER: kavana
          POSTGRES_PASSWORD: kavana_test
          POSTGRES_DB: kavana_warehouse_test
        ports:
          - 5432:5432

    steps:
      - uses: actions/checkout@v4

      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: 20
          cache: 'npm'

      - name: Install dependencies
        run: npm ci

      - name: Generate Prisma client
        run: DATABASE_URL="postgresql://${PGUSER}:${PGPASSWORD}@${PGHOST}:${PGPORT}/${PGDATABASE}" npx prisma generate
        env:
          PGHOST: localhost
          PGPORT: '5432'
          PGUSER: kavana
          PGPASSWORD: kavana_test
          PGDATABASE: kavana_warehouse_test

      - name: Run Prisma migrations
        run: DATABASE_URL="postgresql://${PGUSER}:${PGPASSWORD}@${PGHOST}:${PGPORT}/${PGDATABASE}" npx prisma migrate deploy
        env:
          PGHOST: localhost
          PGPORT: '5432'
          PGUSER: kavana
          PGPASSWORD: kavana_test
          PGDATABASE: kavana_warehouse_test

      - name: Seed database
        run: DATABASE_URL="postgresql://${PGUSER}:${PGPASSWORD}@${PGHOST}:${PGPORT}/${PGDATABASE}" npx prisma db seed
        env:
          PGHOST: localhost
          PGPORT: '5432'
          PGUSER: kavana
          PGPASSWORD: kavana_test
          PGDATABASE: kavana_warehouse_test
          JWT_SECRET: ci-test-secret
          NODE_ENV: test

      - name: Run tests
        run: DATABASE_URL="postgresql://${PGUSER}:${PGPASSWORD}@${PGHOST}:${PGPORT}/${PGDATABASE}" npm test
        env:
          PGHOST: localhost
          PGPORT: '5432'
          PGUSER: kavana
          PGPASSWORD: kavana_test
          PGDATABASE: kavana_warehouse_test
          JWT_SECRET: ci-test-secret
          NODE_ENV: test

  frontend-test:
    runs-on: ubuntu-latest

    steps:
      - uses: actions/checkout@v4

      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: 20
          cache: 'npm'
          cache-dependency-path: dashboard/package-lock.json

      - name: Install dashboard dependencies
        run: npm ci
        working-directory: dashboard

      - name: Run frontend tests (Vitest)
        run: npm test
        working-directory: dashboard

  secret-scan:
    name: Secret scan (gitleaks)
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0
      - name: Run gitleaks
        run: |
          docker run --rm -v "$PWD:/repo" zricethezav/gitleaks:latest \
            detect --source /repo --redact --no-banner --exit-code 1
