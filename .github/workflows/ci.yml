name: CI — KAVANA WAREHOUSE API

on:
  push:
    branches: [main, develop]
    paths-ignore:
      - 'docs/**'
      - 'dashboard/**'
      - 'mobile/**'
      - '**.md'
  pull_request:
    branches: [main]

jobs:
  test:
    runs-on: ubuntu-latest

    services:
      postgres:
        image: postgres:16
        env:
          POSTGRES_USER: kavana
          POSTGRES_PASSWORD: kavana_test
          POSTGRES_DB: kavana_warehouse_test
        ports:
          - 5432:5432

    steps:
      - uses: actions/checkout@v4

      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: 20
          cache: 'npm'

      - name: Install dependencies
        run: npm ci

      - name: Generate Prisma client
        run: npx prisma generate
        env:
          DATABASE_URL: postgresql://kavana:kavana_test@localhost:5432/kavana_warehouse_test

      - name: Run Prisma migrations
        run: npx prisma migrate deploy
        env:
          DATABASE_URL: postgresql://kavana:kavana_test@localhost:5432/kavana_warehouse_test

      - name: Seed database
        run: npx prisma db seed
        env:
          DATABASE_URL: postgresql://kavana:kavana_test@localhost:5432/kavana_warehouse_test
          JWT_SECRET: ci-test-secret
          NODE_ENV: test

      - name: Run tests
        run: npm test -- --json --outputFile=jest-result.json
        env:
          DATABASE_URL: postgresql://kavana:kavana_test@localhost:5432/kavana_warehouse_test
          JWT_SECRET: ci-test-secret
          NODE_ENV: test

      - name: DIAGNOSTICO TEMPORAL - fallos como anotaciones
        if: failure()
        run: |
          node -e '
            const r = require("./jest-result.json");
            console.log(`::error::RESUMEN ${r.numPassedTests} ok / ${r.numFailedTests} fallan / suites con error: ${r.numRuntimeErrorTestSuites}`);
            for (const s of r.testResults) {
              if (s.message && !s.assertionResults.some(a => a.status === "failed")) console.log("::error::SUITE " + s.name.split("/").pop() + " " + s.message.replace(/\x1b\[[0-9;]*m/g,"").replace(/\n/g," | ").slice(0, 1500));
              for (const a of s.assertionResults) if (a.status === "failed")
                console.log("::error::" + s.name.split("/").pop() + " > " + a.fullName + " :: " + a.failureMessages.join(" ").replace(/\x1b\[[0-9;]*m/g,"").replace(/\n/g," | ").slice(0, 900));
            }'

  frontend-test:
    runs-on: ubuntu-latest

    steps:
      - uses: actions/checkout@v4

      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: 20
          cache: 'npm'
          cache-dependency-path: dashboard/package-lock.json

      - name: Install dashboard dependencies
        run: npm ci
        working-directory: dashboard

      - name: Run frontend tests (Vitest)
        run: npm test
        working-directory: dashboard
